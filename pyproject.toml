[project]
name = "scholar-rag"
version = "0.0.0"
requires-python = ">=3.11, <3.12"
dependencies = [
    "google-genai", 
    "dotenv",
    "pandas",
    "scikit-learn",
    "pymupdf"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scholar-rag"]