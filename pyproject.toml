[project]
name = "scholar-rag"
version = "0.0.0"
requires-python = ">=3.11, <3.12"
dependencies = [
    "google-genai", 
    "python-dotenv",
    "pandas",
    "numpy",
    "scikit-learn",
    "pymupdf",
    "pillow",
    "torch>=2.7.0",
    "transformers",
    "accelerate",
    "qdrant-client",
    "ipykernel"
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scholar_rag"]