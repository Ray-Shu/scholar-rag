[project]
name = "scholar-rag"
version = "0.0.0"
requires-python = ">=3.11, <3.12"
dependencies = [
    "google-genai", 
    "python-dotenv",
    "pandas",
    "numpy",
    "scikit-learn",
    "pymupdf",
    "pillow",
    "torch<=2.5.1",
    "transformers",
    "accelerate",
    "qdrant-client",
    "ipykernel"
]

[project.optional.dependencies]
cuda = ["https://download.pytorch.org/whl/cu128"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scholar_rag"]