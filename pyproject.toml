[project]
name = "scholar-rag"
version = "0.0.0"
requires-python = ">=3.11, <3.12"
dependencies = [
    "google-genai", 
    "dotenv",
    "pandas",
    "numpy",
    "scikit-learn",
    "pymupdf",
    "pymupdf4llm",
    "langchain-text-splitters>0.3.0",
    "faiss-cpu",
    "ipykernel"
]

[project.optional.dependencies]
cuda = [
    "faiss-gpu"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scholar_rag"]