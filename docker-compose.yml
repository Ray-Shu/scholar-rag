services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    env_file: .env
    # healthcheck caller because it takes time to load hf model
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 120s
    volumes:
      - ~/.config/gcloud/application_default_credentials.json:/tmp/adc.json:ro
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /tmp/adc.json
      GOOGLE_CLOUD_PROJECT: elated-effect-386202
  
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8501:8501"
    environment: 
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy #wait until healthcheck returns 0 which means healthy